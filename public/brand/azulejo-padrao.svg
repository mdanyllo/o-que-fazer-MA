<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 300" width="400" height="300">
  <!-- Azulejo vetorizado a partir do painel português de São Luís (medalhão lobado em cobalto).
       Cada azulejo (100 × 100) é um medalhão inteiro; os losangos e pontos das bordas
       se completam com os vizinhos. O arquivo tem 4 × 3 azulejos. -->
  <defs>
    <!-- um quarto do contorno: do topo até a direita, com a ponta voltada ao canto -->
    <path id="q" d="M100 18 C116 18 130 24 132 38 C134 50 142 56 150 50 C144 58 150 66 162 68 C176 70 182 84 182 100"/>
    <!-- chifres (volutas) que saem da ponta em direção ao canto -->
    <g id="voluta">
      <path d="M150 50 C152 40 160 34 166 36 C172 38 170 46 164 46 C160 46 159 42 162 40"/>
      <path d="M150 50 C160 48 166 40 164 34 C162 28 154 30 154 36 C154 40 158 41 160 38"/>
    </g>
    <g id="contorno">
      <use xlink:href="#q"/>
      <use xlink:href="#q" transform="rotate(90 100 100)"/>
      <use xlink:href="#q" transform="rotate(180 100 100)"/>
      <use xlink:href="#q" transform="rotate(270 100 100)"/>
    </g>
    <!-- um braço da rosácea central: pétala, folhas laterais enroladas e folha diagonal -->
    <g id="braco">
      <path d="M100 90 C108 80 108 70 100 60 C92 70 92 80 100 90 Z" fill="#1F4E8C"/>
      <circle cx="100" cy="53" r="3" fill="#1F4E8C"/>
      <path d="M100 76 C90 74 84 66 88 59 C91 54 97 57 94 62" fill="none" stroke="#1F4E8C" stroke-width="2.8" stroke-linecap="round"/>
      <path d="M100 76 C110 74 116 66 112 59 C109 54 103 57 106 62" fill="none" stroke="#1F4E8C" stroke-width="2.8" stroke-linecap="round"/>
      <path d="M106 94 C106 82 114 76 126 74 C124 86 118 94 106 94 Z" fill="#1F4E8C"/>
      <circle cx="134" cy="66" r="2.4" fill="#1F4E8C"/>
    </g>
    <symbol id="azulejo" viewBox="0 0 200 200">
      <rect width="200" height="200" fill="#FBF8F2"/>
      <!-- juntas: cada medalhão é feito de quatro peças -->
      <g stroke="#1F4E8C" stroke-opacity=".14" stroke-width="1" fill="none">
        <rect x=".5" y=".5" width="199" height="199"/>
        <path d="M100 0 V200 M0 100 H200"/>
      </g>
      <g transform="translate(100 100) scale(1.08) translate(-100 -100)">
      <!-- contorno grosso do medalhão -->
      <g fill="none" stroke="#1F4E8C" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
        <use xlink:href="#contorno"/>
      </g>
      <!-- linha pontilhada por dentro -->
      <g fill="none" stroke="#1F4E8C" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="0 6.5" transform="translate(100 100) scale(.84) translate(-100 -100)">
        <use xlink:href="#contorno"/>
      </g>
      <!-- volutas nas quatro diagonais -->
      <g fill="none" stroke="#1F4E8C" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
        <use xlink:href="#voluta"/>
        <use xlink:href="#voluta" transform="rotate(90 100 100)"/>
        <use xlink:href="#voluta" transform="rotate(180 100 100)"/>
        <use xlink:href="#voluta" transform="rotate(270 100 100)"/>
      </g>
      </g>
      <!-- rosácea central -->
      <use xlink:href="#braco"/>
      <use xlink:href="#braco" transform="rotate(90 100 100)"/>
      <use xlink:href="#braco" transform="rotate(180 100 100)"/>
      <use xlink:href="#braco" transform="rotate(270 100 100)"/>
      <circle cx="100" cy="100" r="7" fill="#1F4E8C"/>
      <circle cx="100" cy="100" r="2.6" fill="#FBF8F2"/>
      <!-- losangos entre medalhões (um quarto em cada canto) e pontos no meio das bordas -->
      <g fill="#1F4E8C">
        <path d="M0 -16 L11 0 L0 16 L-11 0 Z"/>
        <path d="M200 -16 L211 0 L200 16 L189 0 Z"/>
        <path d="M0 184 L11 200 L0 216 L-11 200 Z"/>
        <path d="M200 184 L211 200 L200 216 L189 200 Z"/>
        <circle cx="100" cy="0" r="4.5"/>
        <circle cx="100" cy="200" r="4.5"/>
        <circle cx="0" cy="100" r="4.5"/>
        <circle cx="200" cy="100" r="4.5"/>
      </g>
      <g fill="#FBF8F2">
        <circle cx="0" cy="0" r="3"/>
        <circle cx="200" cy="0" r="3"/>
        <circle cx="0" cy="200" r="3"/>
        <circle cx="200" cy="200" r="3"/>
      </g>
    </symbol>
  </defs>
  <use xlink:href="#azulejo" x="0" y="0" width="100" height="100"/>
  <use xlink:href="#azulejo" x="100" y="0" width="100" height="100"/>
  <use xlink:href="#azulejo" x="200" y="0" width="100" height="100"/>
  <use xlink:href="#azulejo" x="300" y="0" width="100" height="100"/>
  <use xlink:href="#azulejo" x="0" y="100" width="100" height="100"/>
  <use xlink:href="#azulejo" x="100" y="100" width="100" height="100"/>
  <use xlink:href="#azulejo" x="200" y="100" width="100" height="100"/>
  <use xlink:href="#azulejo" x="300" y="100" width="100" height="100"/>
  <use xlink:href="#azulejo" x="0" y="200" width="100" height="100"/>
  <use xlink:href="#azulejo" x="100" y="200" width="100" height="100"/>
  <use xlink:href="#azulejo" x="200" y="200" width="100" height="100"/>
  <use xlink:href="#azulejo" x="300" y="200" width="100" height="100"/>
</svg>
